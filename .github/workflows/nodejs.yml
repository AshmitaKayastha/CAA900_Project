name: Node.js CI & Deploy to Azure Static Web Apps

on:
  push:
    branches: [ main, branch-test ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/

      - name: Clear proxy settings
        run: |
          npm config delete proxy || true
          npm config delete https-proxy || true

      - name: Set npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (with legacy-peer-deps)
        run: npm install --legacy-peer-deps

      - name: Start backend (server.js)
        run: |
          nohup node server.js > server.log 2>&1 &
          echo "Waiting for backend to start..."
          sleep 10

      - name: Check backend server status
        run: |
          echo "Checking if backend is up on port 5001..."
          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:5001 || exit 1

      - name: Run tests
        run: npm test

      - name: Show server logs if tests fail
        if: failure()
        run: cat server.log

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}  # Required for PR integration
          action: "upload"
          app_location: "client"           # Change if frontend is elsewhere
          api_location: ""                 # Leave blank if not using Azure Functions
          output_location: "build"         # Change to dist if using Vite or other tool
