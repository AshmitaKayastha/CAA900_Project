name: Node.js CI

on:
  push:
    branches: [ main, branch-test ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/

      - name: Clear any proxy settings
        run: |
          npm config delete proxy || true
          npm config delete https-proxy || true

      - name: Set npm registry explicitly
        run: npm config set registry https://registry.npmjs.org/

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Start backend server (server.js)
        run: |
          nohup node server.js > server.log 2>&1 &
          echo "Waiting for backend to start..."
          sleep 10

      - name: Check if server is up
        run: |
          echo "Checking if server is available on port 5001..."
          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:5001 || exit 1

      - name: Run tests
        run: npm test

      - name: Show server logs if tests fail
        if: failure()
        run: cat server.log
