name: Node.js CI

on:
  push:
    branches: [ main, branch-test ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/

      - name: Clear potential proxy settings
        run: |
          npm config delete proxy
          npm config delete https-proxy

      - name: Set public npm registry (explicit)
        run: npm config set registry https://registry.npmjs.org/

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Start backend server (server.js)
        run: |
          nohup node server.js > server.log 2>&1 &
          sleep 5

      - name: Check if server is up
        run: |
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:5001 || exit 1

      - name: Run tests
        run: npm test

      - name: Show server logs if tests fail
        if: failure()
        run: cat server.log
