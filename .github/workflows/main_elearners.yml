name: Build and deploy full-stack Node.js + React app to Azure Web App - elearners

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: 📥 Install backend dependencies
        run: npm install --legacy-peer-deps

      - name: ⚛️ Build React frontend
        run: |
          cd client
          npm install --legacy-peer-deps
          CI=false npm run build
          cd ..

      - name: 📁 Prepare deployment package
        run: |
          mkdir package
          cp -r server.js web.config package.json config routes models validation uploads package/
          cp -r client/build package/client
          cd package
          zip -r ../deploy.zip .
          cd ..

      - name: 📤 Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip
          path: .

      - name: 🔐 Azure Login using credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'elearners'
          slot-name: 'Production'
          package: deploy.zip
