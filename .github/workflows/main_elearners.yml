name: Build and deploy full-stack Node.js + React app to Azure Web App - elearners

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: 📥 Install backend dependencies
        run: npm install --legacy-peer-deps

      - name: ⚛️ Build React frontend
        run: |
          cd client
          npm install --legacy-peer-deps
          CI=false npm run build

      - name: 📁 Prepare deployment package
        run: |
          mkdir -p deployment/client
          cp -r server.js package.json config routes models uploads validation deployment/
          cp -r client/build deployment/client/

      - name: 📤 Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 🔐 Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1FBEF79ADC1F4222A479C27F1A8E0C20 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FF63ADDE36C94E9F920FA27F8411E9FA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0B66193810DB4AD5840B1B3F59032EC1 }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'elearners'
          slot-name: 'Production'
          package: ./node-app
