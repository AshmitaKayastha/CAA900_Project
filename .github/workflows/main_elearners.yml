name: Build and deploy full-stack Node.js + React app to Azure Web App - elearners

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: 📥 Install backend dependencies
        run: npm install --legacy-peer-deps

      - name: ⚛️ Build React frontend
        working-directory: client
        run: |
          npm install --legacy-peer-deps
          CI=false npm run build

      - name: 🔧 Prepare deployment package
        run: |
          mkdir deploy-folder
          cp -r server.js package.json package-lock.json build config models routes validation uploads deploy-folder 2>/dev/null || true
          cd deploy-folder
          zip -r ../deploy.zip .

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip
          path: .

      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'elearners'
          package: deploy.zip
